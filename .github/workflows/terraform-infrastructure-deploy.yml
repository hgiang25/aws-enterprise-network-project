name: Terraform Infrastructure Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        type: choice
        default: "apply"
        options:
          - plan
          - apply

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  TERRAFORM_VERSION: "1.10.5"
  TF_STATE_BUCKET: terraform-state-enterprise-network-248195880649

jobs:
  bootstrap:
    name: Ensure Terraform Backend Exists
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check or create Terraform state bucket
        run: |
          set -euo pipefail

          echo "Checking S3 bucket: ${TF_STATE_BUCKET}"

          if aws s3api head-bucket --bucket "${TF_STATE_BUCKET}" 2>/dev/null; then
            echo "Bucket already exists: ${TF_STATE_BUCKET}"
          else
            echo "Bucket does not exist. Creating: ${TF_STATE_BUCKET}"

            aws s3api create-bucket \
              --bucket "${TF_STATE_BUCKET}" \
              --region "${AWS_REGION}" \
              --create-bucket-configuration LocationConstraint="${AWS_REGION}"

            echo "Waiting until bucket exists..."
            aws s3api wait bucket-exists --bucket "${TF_STATE_BUCKET}"
          fi

      - name: Configure Terraform state bucket
        run: |
          set -euo pipefail

          echo "Enabling versioning..."
          aws s3api put-bucket-versioning \
            --bucket "${TF_STATE_BUCKET}" \
            --versioning-configuration Status=Enabled

          echo "Enabling server-side encryption..."
          aws s3api put-bucket-encryption \
            --bucket "${TF_STATE_BUCKET}" \
            --server-side-encryption-configuration '{
              "Rules": [
                {
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  },
                  "BucketKeyEnabled": true
                }
              ]
            }'

          echo "Blocking public access..."
          aws s3api put-public-access-block \
            --bucket "${TF_STATE_BUCKET}" \
            --public-access-block-configuration '{
              "BlockPublicAcls": true,
              "IgnorePublicAcls": true,
              "BlockPublicPolicy": true,
              "RestrictPublicBuckets": true
            }'

      - name: Verify Terraform state bucket
        run: |
          set -euo pipefail

          aws s3api head-bucket --bucket "${TF_STATE_BUCKET}"
          aws s3api get-bucket-versioning --bucket "${TF_STATE_BUCKET}"
          aws s3api get-bucket-encryption --bucket "${TF_STATE_BUCKET}"
          aws s3api get-public-access-block --bucket "${TF_STATE_BUCKET}"

          echo "Terraform backend is ready."

  network:
    name: Terraform ${{ github.event.inputs.action }} enterprise network
    runs-on: ubuntu-latest
    needs: bootstrap

    defaults:
      run:
        working-directory: infrastructure/environments/aws_network

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform fmt -check -recursive ../../

      - name: Terraform init
        run: terraform init -reconfigure

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform apply -auto-approve tfplan

  readiness:
    name: Network readiness checks
    runs-on: ubuntu-latest
    needs: network
    if: ${{ github.event.inputs.action == 'apply' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run network readiness checks
        run: bash scripts/network-readiness.sh
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          PROJECT: aws-enterprise-network
          DEPLOYMENT: aws
