name: Terraform Infrastructure Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        type: choice
        default: "apply"
        options:
          - plan
          - apply

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  TERRAFORM_VERSION: "1.10.5"
  TF_STATE_BUCKET: terraform-state-enterprise-network-248195880649

jobs:
  bootstrap:
    name: Bootstrap Terraform Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/bootstrap

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init bootstrap
        run: terraform init

      - name: Import S3 state bucket only if it already exists
        run: |
          if aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "S3 bucket $TF_STATE_BUCKET already exists. Importing into Terraform state..."
            terraform import aws_s3_bucket.tf_state "$TF_STATE_BUCKET" || true
          else
            echo "S3 bucket $TF_STATE_BUCKET does not exist yet. Terraform will create it."
          fi

      - name: Terraform apply bootstrap
        run: terraform apply -auto-approve

  network:
    name: Terraform ${{ github.event.inputs.action }} enterprise network
    runs-on: ubuntu-latest
    needs: bootstrap

    defaults:
      run:
        working-directory: infrastructure/environments/aws_network

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform fmt -check -recursive ../../

      - name: Terraform init
        run: terraform init -reconfigure

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform apply -auto-approve tfplan

  readiness:
    name: Network readiness checks
    runs-on: ubuntu-latest
    needs: network
    if: ${{ github.event.inputs.action == 'apply' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run network readiness checks
        run: bash scripts/network-readiness.sh
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          PROJECT: aws-enterprise-network
          DEPLOYMENT: aws
