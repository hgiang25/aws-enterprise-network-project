name: Terraform Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  TERRAFORM_VERSION: "1.10.5"

jobs:
  bootstrap:
    name: Bootstrap Terraform S3 Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/bootstrap

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init
        run: terraform init

      - name: Import S3 state bucket if it already exists
        run: terraform import aws_s3_bucket.tf_state terraform-state-enterprise-network-248195880649 || true

      - name: Terraform apply bootstrap
        run: terraform apply -auto-approve
