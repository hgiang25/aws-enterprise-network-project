name: Terraform Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  TF_STATE_BUCKET: terraform-state-enterprise-network-248195880649

jobs:
  bootstrap:
    name: Bootstrap Terraform S3 Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check or create Terraform state bucket
        run: |
          set -euo pipefail

          echo "Checking S3 bucket: ${TF_STATE_BUCKET}"

          if aws s3api head-bucket --bucket "${TF_STATE_BUCKET}" 2>/dev/null; then
            echo "Bucket already exists: ${TF_STATE_BUCKET}"
          else
            echo "Bucket does not exist. Creating: ${TF_STATE_BUCKET}"

            aws s3api create-bucket \
              --bucket "${TF_STATE_BUCKET}" \
              --region "${AWS_REGION}" \
              --create-bucket-configuration LocationConstraint="${AWS_REGION}"

            echo "Waiting until bucket exists..."
            aws s3api wait bucket-exists --bucket "${TF_STATE_BUCKET}"
          fi

      - name: Configure Terraform state bucket
        run: |
          set -euo pipefail

          echo "Enabling versioning..."
          aws s3api put-bucket-versioning \
            --bucket "${TF_STATE_BUCKET}" \
            --versioning-configuration Status=Enabled

          echo "Enabling server-side encryption..."
          aws s3api put-bucket-encryption \
            --bucket "${TF_STATE_BUCKET}" \
            --server-side-encryption-configuration '{
              "Rules": [
                {
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  },
                  "BucketKeyEnabled": true
                }
              ]
            }'

          echo "Blocking public access..."
          aws s3api put-public-access-block \
            --bucket "${TF_STATE_BUCKET}" \
            --public-access-block-configuration '{
              "BlockPublicAcls": true,
              "IgnorePublicAcls": true,
              "BlockPublicPolicy": true,
              "RestrictPublicBuckets": true
            }'

      - name: Verify Terraform state bucket
        run: |
          set -euo pipefail

          echo "Verifying bucket exists..."
          aws s3api head-bucket --bucket "${TF_STATE_BUCKET}"

          echo "Verifying versioning..."
          aws s3api get-bucket-versioning --bucket "${TF_STATE_BUCKET}"

          echo "Verifying encryption..."
          aws s3api get-bucket-encryption --bucket "${TF_STATE_BUCKET}"

          echo "Verifying public access block..."
          aws s3api get-public-access-block --bucket "${TF_STATE_BUCKET}"

          echo "Terraform backend bootstrap is ready."
